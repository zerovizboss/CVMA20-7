plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cvma.promptapprover'
    compileSdk 34

    defaultConfig {
        applicationId "com.cvma.promptapprover"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1-moto-g-2025"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Optimize for Moto G 2025 performance
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a' // Modern ARM architectures
        }

        // Enable vector drawable support for better graphics
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Optimize for Moto G 2025 battery and performance
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Core Android dependencies (Kotlin-compatible)
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // WebSocket - Stable version
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
