name: 🛡️ CVMA Security Scan and Remediation

on:
  push:
    branches: [ main, feature/*, epic-* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily scan at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

jobs:
  security-scan:
    name: 🔍 GitGuardian Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install ggshield
        run: |
          pip install ggshield

      - name: 🛡️ GitGuardian Scan
        id: scan
        run: |
          ggshield secret scan repo . --output sarif > security-scan-results.sarif
          echo "scan_result=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: 📤 Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-scan-results.sarif
          category: gitguardian

      - name: 🚨 Create Security Issue on Findings
        if: steps.scan.outputs.scan_result != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = `🛡️ Security Scan Alert: Secrets Detected - ${new Date().toISOString().split('T')[0]}`;
            const issueBody = `
            ## 🚨 GitGuardian Security Scan Alert

            **Date**: ${new Date().toISOString()}
            **Branch**: ${context.ref}
            **Commit**: ${context.sha.substring(0, 7)}

            ### ⚠️ Potential secrets detected in repository

            GitGuardian has detected potential secrets or sensitive information in the repository.

            ### 🔍 Details
            - Check the Security tab for detailed SARIF results
            - Review the specific files and lines flagged
            - Take immediate action to remove any confirmed secrets

            ### 📋 Remediation Checklist
            - [ ] Review flagged files in Security tab
            - [ ] Remove any confirmed secrets from code
            - [ ] Rotate compromised credentials if necessary
            - [ ] Update .gitignore or .ggshield.yaml to prevent future exposure
            - [ ] Verify secrets are not in git history

            ### 🏍️ CVMA Security Protocol
            This issue was automatically created by the CVMA Security Scan workflow.
            Contact the DevSecOps team for assistance with remediation.

            **Priority**: High
            **Epic**: Security & Compliance
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['security', 'high-priority', 'automated']
            });

  remediation-workflow:
    name: 🔧 Automated Remediation Setup
    needs: security-scan
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Create Remediation Branch
        run: |
          BRANCH_NAME="security/auto-remediation-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          echo "REMEDIATION_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV

      - name: 📝 Create .ggshield.yaml Config
        run: |
          cat > .ggshield.yaml << 'EOF'
          # GitGuardian configuration for CVMA repositories
          version: 2

          secret:
            show_secrets: false

          paths_ignore:
            - "**/*.md"
            - "**/test-results/**"
            - "**/.github/**"
            - "**/docs/**"

          matches_ignore:
            - name: "Test data ignore"
              match: "test_"
            - name: "CVMA test patterns"
              match: "cvma_test_"

          exit_zero: false
          verbose: false

          # Additional security configurations
          exclude:
            - "Generic High Entropy Secret"
          EOF

      - name: 📝 Update .gitignore for Security
        run: |
          cat >> .gitignore << 'EOF'

          # Security-sensitive files
          *.pem
          *.key
          *.p12
          *.pfx
          .env.local
          .env.production
          config/secrets.yml
          config/database.yml.example

          # Salesforce-specific security exclusions
          certificates/
          connected_apps/
          jwt_keys/
          EOF

      - name: 🚀 Create Remediation PR
        run: |
          git add .ggshield.yaml .gitignore
          git commit -m "🛡️ Security: Add GitGuardian config and enhanced .gitignore

          - Add .ggshield.yaml for secret scanning configuration
          - Enhanced .gitignore to prevent common secret file types
          - Automated remediation for security compliance

          🤖 Auto-generated by CVMA Security Scan workflow"

          git push origin $REMEDIATION_BRANCH

      - name: 📝 Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = `🛡️ Security: Automated remediation configuration`;
            const prBody = `
            ## 🛡️ Automated Security Remediation

            This PR was automatically created in response to security scan findings.

            ### 🔧 Changes Made
            - ✅ Added \`.ggshield.yaml\` configuration file
            - ✅ Enhanced \`.gitignore\` with security-sensitive patterns
            - ✅ Configured GitGuardian scanning parameters

            ### 🎯 Purpose
            - Prevent future secret exposure
            - Configure appropriate scanning exclusions
            - Establish baseline security configuration

            ### ✅ Next Steps
            1. Review the configuration files
            2. Merge this PR to apply security hardening
            3. Address any specific secrets found in the security scan
            4. Verify no secrets remain in git history

            ### 🏍️ CVMA DevSecOps Protocol
            This remediation follows CVMA security best practices and compliance requirements.

            **Auto-generated by**: CVMA Security Scan Workflow
            **Branch**: ${process.env.REMEDIATION_BRANCH}
            `;

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: prTitle,
              body: prBody,
              head: process.env.REMEDIATION_BRANCH,
              base: 'main',
              draft: false
            });