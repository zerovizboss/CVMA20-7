<template>
    <lightning-card title="Epic #8 Analytics Excellence Dashboard" icon-name="custom:custom63">
        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh Dashboard"
                onclick={handleRefresh}>
            </lightning-button-icon>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-is-relative" style="height: 300px;">
                <lightning-spinner alternative-text="Loading Dashboard..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error Display -->
        <template if:true={error}>
            <div class="slds-m-around_medium">
                <lightning-message-service variant="error"
                    title="Dashboard Load Error"
                    message="Unable to load Epic #8 dashboard data. Please refresh and try again.">
                </lightning-message-service>
            </div>
        </template>

        <!-- Main Dashboard Content -->
        <template if:false={isLoading}>
            <template if:false={error}>
                <!-- Navigation Tabs -->
                <div class="slds-tabs_default slds-m-bottom_medium">
                    <ul class="slds-tabs_default__nav" role="tablist">
                        <li class="slds-tabs_default__item" role="presentation">
                            <a class="slds-tabs_default__link"
                               data-view="overview"
                               onclick={handleViewChange}
                               aria-selected={isOverviewActive}
                               tabindex={isOverviewActive}>Overview</a>
                        </li>
                        <li class="slds-tabs_default__item" role="presentation">
                            <a class="slds-tabs_default__link"
                               data-view="veteranservices"
                               onclick={handleViewChange}
                               aria-selected={isVeteranServicesActive}
                               tabindex={isVeteranServicesActive}>Veteran Services</a>
                        </li>
                        <li class="slds-tabs_default__item" role="presentation">
                            <a class="slds-tabs_default__link"
                               data-view="governmentservices"
                               onclick={handleViewChange}
                               aria-selected={isGovernmentServicesActive}
                               tabindex={isGovernmentServicesActive}>Government Services</a>
                        </li>
                        <template if:true={hasPremiumAccess}>
                            <li class="slds-tabs_default__item" role="presentation">
                                <a class="slds-tabs_default__link"
                                   data-view="crosschapter"
                                   onclick={handleViewChange}
                                   aria-selected={isCrossChapterActive}
                                   tabindex={isCrossChapterActive}>Cross-Chapter Analytics</a>
                            </li>
                            <li class="slds-tabs_default__item" role="presentation">
                                <a class="slds-tabs_default__link"
                                   data-view="automation"
                                   onclick={handleViewChange}
                                   aria-selected={isAutomationActive}
                                   tabindex={isAutomationActive}>Automation Engine</a>
                            </li>
                            <li class="slds-tabs_default__item" role="presentation">
                                <a class="slds-tabs_default__link"
                                   data-view="analytics"
                                   onclick={handleViewChange}
                                   aria-selected={isAnalyticsActive}
                                   tabindex={isAnalyticsActive}>Einstein Analytics</a>
                            </li>
                        </template>
                    </ul>
                </div>

                <!-- Overview Tab Content -->
                <template if:true={isOverviewActive}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- Phase 3 Status -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                            <lightning-card title="Epic #8 Phase 3 Status">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <div class={phase3StatusClass}>{phase3Status}</div>
                                    <p class="slds-text-body_small slds-m-top_small">
                                        Government Integration Excellence Status
                                    </p>
                                </div>
                            </lightning-card>
                        </div>

                        <!-- Deployment Metrics -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                            <lightning-card title="Deployment Metrics">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <div class="metric-value">{deploymentMetrics.completion_percentage}%</div>
                                    <p class="slds-text-body_small">Epic #8 Completion</p>
                                    <div class="slds-m-top_small">
                                        <lightning-progress-bar value={deploymentMetrics.completion_percentage}></lightning-progress-bar>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>

                        <!-- Success Indicators -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                            <lightning-card title="Success Indicators">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <template for:each={successIndicators} for:item="indicator">
                                        <div key={indicator.id} class="slds-m-bottom_x-small">
                                            <lightning-icon icon-name="utility:success"
                                                           alternative-text="Success"
                                                           size="x-small"
                                                           variant="success"
                                                           class="slds-m-right_x-small"></lightning-icon>
                                            <span class="slds-text-body_small">{indicator.name}</span>
                                        </div>
                                    </template>
                                </div>
                            </lightning-card>
                        </div>
                    </div>
                </template>

                <!-- Veteran Services Tab Content -->
                <template if:true={isVeteranServicesActive}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-card title="VA Benefits Integration">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <div class="metric-value">{veteranServicesStatus}</div>
                                    <div class={integrationHealthClass}>
                                        {integrationHealth}% Health Score
                                    </div>
                                    <p class="slds-text-body_small slds-m-top_small">
                                        Services provided today: {servicesProvidedToday}
                                    </p>
                                </div>
                            </lightning-card>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-card title="Crisis Support System">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <div class="metric-value">24/7</div>
                                    <p class="slds-text-body_small">Available Support</p>
                                    <div class="slds-m-top_small">
                                        <lightning-button variant="brand" label="Access Crisis Support"></lightning-button>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>
                    </div>
                </template>

                <!-- Government Services Tab Content -->
                <template if:true={isGovernmentServicesActive}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- VA Benefits Overview -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-card title="VA Benefits Status" icon-name="standard:account">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <template if:true={vaBenefitsData.isEligible}>
                                        <div class="metric-value">{vaBenefitsData.disability.disabilityRating}%</div>
                                        <p class="slds-text-body_small">Disability Rating</p>
                                        <div class="slds-m-top_small">
                                            <div class="metric-small">Monthly Compensation: {formattedCompensation}</div>
                                            <div class="metric-small">Healthcare: {vaBenefitsData.healthcare.enrollmentStatus}</div>
                                        </div>
                                    </template>
                                    <template if:false={vaBenefitsData.isEligible}>
                                        <div class="slds-text-body_small">VA benefits verification pending</div>
                                    </template>
                                    <div class="slds-m-top_small">
                                        <lightning-button variant="neutral" label="View Full Benefits" onclick={handleViewVABenefits}></lightning-button>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>

                        <!-- Military Service Verification -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-card title="Military Service Verification" icon-name="standard:portal">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <template if:true={dodRecordsData.isVerified}>
                                        <div class="metric-value">{dodRecordsData.serviceRecord.serviceBranch}</div>
                                        <p class="slds-text-body_small">Service Branch</p>
                                        <div class="slds-m-top_small">
                                            <div class="metric-small">Rank: {dodRecordsData.serviceRecord.highestRank}</div>
                                            <div class="metric-small">Status: {dodRecordsData.serviceRecord.dischargeType}</div>
                                            <template if:true={dodRecordsData.serviceRecord.isCombatVeteran}>
                                                <div class="slds-m-top_x-small">
                                                    <lightning-icon icon-name="utility:success" alternative-text="Combat Veteran" size="x-small" variant="success" class="slds-m-right_x-small"></lightning-icon>
                                                    <span class="slds-text-body_small">Combat Veteran Verified</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={dodRecordsData.isVerified}>
                                        <div class="slds-text-body_small">Military service verification pending</div>
                                    </template>
                                    <div class="slds-m-top_small">
                                        <lightning-button variant="neutral" label="View Service Records" onclick={handleViewDODRecords}></lightning-button>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>

                        <!-- Benefits Optimization -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-card title="Benefits Optimization" icon-name="standard:coaching">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <div class="metric-value">{benefitRecommendations.length}</div>
                                    <p class="slds-text-body_small">Available Recommendations</p>
                                    <div class="slds-m-top_small">
                                        <template if:true={hasBenefitRecommendations}>
                                            <template for:each={firstThreeRecommendations} for:item="recommendation">
                                                <div key={recommendation} class="slds-m-bottom_x-small">
                                                    <lightning-icon icon-name="utility:info" alternative-text="Recommendation" size="x-small" variant="info" class="slds-m-right_x-small"></lightning-icon>
                                                    <span class="slds-text-body_small">{recommendation}</span>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={hasBenefitRecommendations}>
                                            <div class="slds-text-body_small">No recommendations available</div>
                                        </template>
                                    </div>
                                    <div class="slds-m-top_small">
                                        <lightning-button variant="brand" label="Get Optimization Report" onclick={handleOptimizationReport}></lightning-button>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>

                        <!-- Government Resources -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-card title="Government Resources" icon-name="standard:resource_territory">
                                <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                    <div class="slds-m-bottom_medium">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Quick Access</h3>
                                        <div class="slds-grid slds-wrap slds-gutters_x-small">
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-button variant="neutral" label="VA.gov" onclick={handleVAGovAccess} class="slds-size_1-of-1"></lightning-button>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-button variant="neutral" label="eBenefits" onclick={handleEBenefitsAccess} class="slds-size_1-of-1"></lightning-button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-m-top_small">
                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Status Indicators</h3>
                                        <div class="slds-grid slds-wrap slds-gutters_x-small">
                                            <div class="slds-col slds-size_1-of-1">
                                                <div class={govServicesHealthClass}>Government Services: {govServicesHealth}% Available</div>
                                                <div class="slds-m-top_x-small">
                                                    <lightning-progress-bar value={govServicesHealth} size="small"></lightning-progress-bar>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>
                    </div>
                </template>

                <!-- Cross-Chapter Analytics Tab (Premium Only) -->
                <template if:true={isCrossChapterActive}>
                    <template if:true={hasPremiumAccess}>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-card title="National Chapter Network">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <div class="metric-value">{chaptersConnected}</div>
                                        <p class="slds-text-body_small">Chapters Connected</p>
                                        <div class="slds-m-top_small">
                                            <div class="metric-small">Collaboration Score: {collaborationScore}%</div>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-card title="Cross-Chapter Intelligence">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <p class="slds-text-body_small">Real-time collaboration and resource sharing across all CVMA chapters nationwide.</p>
                                        <div class="slds-m-top_small">
                                            <lightning-button variant="neutral" label="View Network Analytics"></lightning-button>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- Automation Engine Tab (Premium Only) -->
                <template if:true={isAutomationActive}>
                    <template if:true={hasPremiumAccess}>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-card title="Active Workflows">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <div class="metric-value">{activeWorkflows}</div>
                                        <p class="slds-text-body_small">AI Workflows Running</p>
                                    </div>
                                </lightning-card>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-card title="Automation Efficiency">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <div class="metric-value">{automationEfficiency}%</div>
                                        <p class="slds-text-body_small">Process Efficiency</p>
                                    </div>
                                </lightning-card>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-card title="ROI Impact">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <div class="metric-value">{automationROI}</div>
                                        <p class="slds-text-body_small">Monthly Savings</p>
                                    </div>
                                </lightning-card>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- Einstein Analytics Tab (Premium Only) -->
                <template if:true={isAnalyticsActive}>
                    <template if:true={hasPremiumAccess}>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-card title="Predictive Accuracy">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <div class="metric-value">{predictiveAccuracy}%</div>
                                        <p class="slds-text-body_small">AI Model Accuracy</p>
                                        <div class="slds-m-top_small">
                                            <lightning-progress-bar value={predictiveAccuracy}></lightning-progress-bar>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-card title="Member Retention">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <div class="metric-value">{memberRetentionForecast}%</div>
                                        <p class="slds-text-body_small">Retention Forecast</p>
                                    </div>
                                </lightning-card>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <lightning-card title="Event Success">
                                    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                        <div class="metric-value">{eventSuccessPrediction}%</div>
                                        <p class="slds-text-body_small">Success Prediction</p>
                                    </div>
                                </lightning-card>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- Access Level Notification for Basic Users -->
                <template if:false={hasPremiumAccess}>
                    <template if:true={isCrossChapterActive}>
                        <div class="slds-m-around_medium">
                            <lightning-message-service variant="info"
                                title="Premium Feature"
                                message="Cross-Chapter Analytics requires Premium Member access. Contact your Chapter leadership for upgrade information.">
                            </lightning-message-service>
                        </div>
                    </template>
                    <template if:true={isAutomationActive}>
                        <div class="slds-m-around_medium">
                            <lightning-message-service variant="info"
                                title="Premium Feature"
                                message="Automation Engine requires Premium Member access. Contact your Chapter leadership for upgrade information.">
                            </lightning-message-service>
                        </div>
                    </template>
                    <template if:true={isAnalyticsActive}>
                        <div class="slds-m-around_medium">
                            <lightning-message-service variant="info"
                                title="Premium Feature"
                                message="Einstein Analytics requires Premium Member access. Contact your Chapter leadership for upgrade information.">
                            </lightning-message-service>
                        </div>
                    </template>
                </template>
            </template>
        </template>
    </lightning-card>
</template>
