<template>
    <!-- CVMA Treasurer's Corner Header -->
    <div class="slds-card cvma-treasurers-corner">
        <div class="slds-card__header cvma-report-header">
            <div class="slds-grid slds-grid_align-spread">
                <div class="slds-col">
                    <h2 class="slds-card__header-title cvma-report-title">
                        <lightning-icon icon-name="utility:money" size="medium" class="cvma-icon"></lightning-icon>
                        {reportTitle}
                    </h2>
                    <p class="slds-text-body_small cvma-subtitle">Combat Veterans Motorcycle Association - Vets Serving Vets</p>
                </div>
                <div class="slds-col slds-no-flex">
                    <lightning-button-group>
                        <lightning-button variant="neutral" label="Refresh" onclick={handleRefresh} disabled={isLoading}></lightning-button>
                        <lightning-button if:false={hideExportButton} variant="brand" label="Export Report" onclick={handleExportReport}></lightning-button>
                    </lightning-button-group>
                </div>
            </div>
        </div>

        <!-- Report Period Selection -->
        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <lightning-combobox
                        label="Report Month"
                        value={selectedMonth}
                        options={monthOptions}
                        onchange={handleMonthChange}
                        variant="label-inline">
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-combobox
                        label="Report Year"
                        value={selectedYear}
                        options={yearOptions}
                        onchange={handleYearChange}
                        variant="label-inline">
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_2-of-4">
                    <fieldset class="slds-form-element">
                        <legend class="slds-form-element__legend slds-form-element__label">Report Sections</legend>
                        <div class="slds-form-element__control">
                            <div class="slds-checkbox_button-group">
                                <input type="checkbox" name="summary" id="summary" value="summary" checked data-section="summary" onchange={handleSectionToggle} />
                                <label class="slds-checkbox_button__label" for="summary">
                                    <span class="slds-checkbox_button">Summary</span>
                                </label>
                                <input type="checkbox" name="income" id="income" value="income" checked data-section="income" onchange={handleSectionToggle} />
                                <label class="slds-checkbox_button__label" for="income">
                                    <span class="slds-checkbox_button">Income</span>
                                </label>
                                <input type="checkbox" name="expenses" id="expenses" value="expenses" checked data-section="expenses" onchange={handleSectionToggle} />
                                <label class="slds-checkbox_button__label" for="expenses">
                                    <span class="slds-checkbox_button">Expenses</span>
                                </label>
                                <input type="checkbox" name="memberFinancial" id="memberFinancial" value="memberFinancial" checked data-section="memberFinancial" onchange={handleSectionToggle} />
                                <label class="slds-checkbox_button__label" for="memberFinancial">
                                    <span class="slds-checkbox_button">Members</span>
                                </label>
                            </div>
                        </div>
                    </fieldset>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-m-vertical_large">
                    <lightning-spinner alternative-text="Loading financial data..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Error Display -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error">
                    <span class="slds-assistive-text">Error</span>
                    <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    Error loading treasurer's report data. Please try refreshing the page.
                </div>
            </template>

            <!-- Financial Summary Section -->
            <template if:true={hasFinancialData}>
                <template if:true={reportSections.summary}>
                    <div class="slds-section slds-is-open cvma-report-section">
                        <h3 class="slds-section__title slds-theme_shade">
                            <button class="slds-button slds-section__title-action" aria-expanded="true">
                                <lightning-icon icon-name="utility:summary" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-truncate">Financial Position Summary</span>
                            </button>
                        </h3>
                        <div class="slds-section__content">
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-tile label="Beginning Balance" class="cvma-financial-tile">
                                        <p class="slds-text-heading_large cvma-currency">{formattedBeginningBalance}</p>
                                    </lightning-tile>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-tile label="Ending Balance" class="cvma-financial-tile">
                                        <p class="slds-text-heading_large cvma-currency">{formattedEndingBalance}</p>
                                    </lightning-tile>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters slds-m-top_medium">
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-tile label="Total Income" class="cvma-income-tile">
                                        <p class="slds-text-heading_medium cvma-currency-positive">{formattedTotalIncome}</p>
                                    </lightning-tile>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-tile label="Total Expenses" class="cvma-expense-tile">
                                        <p class="slds-text-heading_medium cvma-currency-negative">{formattedTotalExpenses}</p>
                                    </lightning-tile>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-tile label="Net Change" class="cvma-net-tile">
                                        <p class="slds-text-heading_medium cvma-currency">{formattedNetChange}</p>
                                    </lightning-tile>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Income Categories Section -->
                <template if:true={reportSections.income}>
                    <div class="slds-section slds-is-open cvma-report-section">
                        <h3 class="slds-section__title slds-theme_shade">
                            <button class="slds-button slds-section__title-action" aria-expanded="true">
                                <lightning-icon icon-name="utility:add" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-truncate">Income Categories</span>
                            </button>
                        </h3>
                        <div class="slds-section__content">
                            <lightning-datatable
                                key-field="category"
                                data={incomeCategories}
                                columns={incomeColumns}
                                hide-checkbox-column="true"
                                class="cvma-financial-table">
                            </lightning-datatable>
                        </div>
                    </div>
                </template>

                <!-- Member Financial Status Section -->
                <template if:true={reportSections.memberFinancial}>
                    <div class="slds-section slds-is-open cvma-report-section">
                        <h3 class="slds-section__title slds-theme_shade">
                            <button class="slds-button slds-section__title-action" aria-expanded="true">
                                <lightning-icon icon-name="utility:people" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-truncate">Member Financial Status</span>
                            </button>
                        </h3>
                        <div class="slds-section__content">
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-tile label="Total Members" class="cvma-member-tile">
                                        <p class="slds-text-heading_large">{membershipMetrics.totalMembers}</p>
                                    </lightning-tile>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-tile label="Household Count" class="cvma-member-tile">
                                        <p class="slds-text-heading_large">{membershipMetrics.householdCount}</p>
                                    </lightning-tile>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-tile label="Average Contribution" class="cvma-member-tile">
                                        <p class="slds-text-heading_large cvma-currency">{membershipMetrics.averageContribution}</p>
                                    </lightning-tile>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- Report Footer -->
        <div class="slds-card__footer cvma-report-footer">
            <div class="slds-grid slds-grid_align-spread">
                <div class="slds-col">
                    <p class="slds-text-body_small">
                        <lightning-icon icon-name="utility:shield" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        Report generated on {currentDateTime} | CVMA Chapter 20-7 Financial Transparency
                    </p>
                </div>
                <div class="slds-col slds-no-flex">
                    <p class="slds-text-body_small">
                        Treasurer: {treasurerName} |
                        <lightning-formatted-email value={treasurerEmail}></lightning-formatted-email>
                    </p>
                </div>
            </div>
        </div>
    </div>
</template>
