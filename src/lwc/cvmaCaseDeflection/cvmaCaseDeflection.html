<template>
    <!-- CVMA Case Deflection - Knowledge Base Integration -->
    <div class="cvma-case-deflection slds-card">

        <!-- Header -->
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-utility-knowledge_base">
                        <lightning-icon icon-name="utility:knowledge_base" alternative-text="Help" size="medium"></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>{headerTitle}</span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">

            <!-- Search Articles -->
            <div class="slds-form-element slds-m-bottom_medium">
                <label class="slds-form-element__label" for="article-search">
                    Search Help Articles
                </label>
                <div class="slds-form-element__control">
                    <lightning-input
                        name="article-search"
                        type="search"
                        placeholder={searchPlaceholder}
                        value={searchTerm}
                        onchange={handleSearchChange}
                        class="search-input">
                    </lightning-input>
                </div>
                <div class="slds-form-element__help">
                    Type keywords like "password", "registration", or "payment"
                </div>
            </div>

            <!-- Suggested Articles -->
            <template if:true={hasSearchResults}>
                <div class="suggested-articles slds-m-bottom_large">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">
                        Suggested Articles
                    </h3>

                    <div class="articles-list">
                        <template for:each={suggestedArticles} for:item="article">
                            <div key={article.id} class="article-card slds-box slds-box_x-small slds-m-bottom_small">

                                <!-- Urgent Banner -->
                                <template if:true={article.urgent}>
                                    <div class="urgent-banner slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_x-small">
                                        <span class="slds-assistive-text">Warning</span>
                                        <span class="urgent-icon" aria-hidden="true">🚨</span>
                                        <h4>Crisis Support Available 24/7</h4>
                                    </div>
                                </template>

                                <!-- Article Content -->
                                <div class="article-header slds-grid slds-grid_align-spread">
                                    <div class="slds-col">
                                        <h4 class="article-title">
                                            <button
                                                type="button"
                                                class="article-link slds-button slds-button_base"
                                                data-article-id={article.id}
                                                onclick={handleArticleClick}>
                                                {article.title}
                                            </button>
                                        </h4>
                                        <p class="article-summary slds-text-body_small slds-text-color_weak">
                                            {article.summary}
                                        </p>
                                    </div>
                                    <div class="article-meta slds-col slds-no-flex slds-text-align_right">
                                        <div class="helpfulness-score">
                                            <span class="slds-text-body_small">
                                                👍 {article.helpfulness}%
                                            </span>
                                        </div>
                                        <div class="article-category slds-badge">
                                            {article.category}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- No Results -->
            <template if:true={showNoResults}>
                <div class="no-results slds-text-align_center slds-m-vertical_large">
                    <lightning-icon icon-name="utility:search" size="large" class="slds-m-bottom_small"></lightning-icon>
                    <h3 class="slds-text-heading_small">No articles found</h3>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        Try different keywords or create a support case for personalized help
                    </p>
                </div>
            </template>

            <!-- Create Case Section -->
            <template if:true={enableCaseCreation}>
                <div class="create-case-section slds-m-top_large">
                    <div class="slds-text-align_center">
                        <button
                            type="button"
                            class="cvma-btn-combat-action slds-button slds-button_brand"
                            onclick={handleCreateCase}
                            disabled={showCaseForm}>
                            {createCaseButtonLabel}
                        </button>
                    </div>
                </div>
            </template>

        </div>
    </div>

    <!-- Case Creation Modal -->
    <template if:true={showCaseForm}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={handleCaseFormCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Create Support Case</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-form slds-form_stacked">
                        <lightning-input
                            label="Subject"
                            type="text"
                            placeholder="Brief description of your issue"
                            required>
                        </lightning-input>

                        <lightning-combobox
                            label="Category"
                            placeholder="Select a category"
                            options={categoryOptions}
                            required>
                        </lightning-combobox>

                        <lightning-textarea
                            label="Description"
                            placeholder="Please describe your issue in detail..."
                            required>
                        </lightning-textarea>

                        <lightning-input
                            label="Contact Email"
                            type="email"
                            placeholder="your.email@cvma.org">
                        </lightning-input>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCaseFormCancel}></lightning-button>
                    <lightning-button variant="brand" label="Submit Case" onclick={handleCaseFormSubmit} disabled={isLoading}>
                        <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Submitting..." size="x-small"></lightning-spinner>
                        </template>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
