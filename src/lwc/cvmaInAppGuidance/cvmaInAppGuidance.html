<template>
    <!-- Screen Reader Announcements -->
    <div class="slds-assistive-text sr-announcement" aria-live="polite" aria-atomic="true"></div>

    <!-- In-App Guidance Modal -->
    <template if:true={isVisible}>
        <section
            role="dialog"
            tabindex="-1"
            aria-labelledby="guidance-title"
            aria-describedby="guidance-content"
            aria-modal="true"
            class={guidanceClasses}
            onkeydown={handleKeyDown}>

            <div class="slds-modal__container guidance-container">
                <!-- Header -->
                <header class="slds-modal__header guidance-header">
                    <div class="slds-grid slds-gutters_small slds-grid_align-spread">
                        <div class="slds-col">
                            <h2 id="guidance-title" class="slds-text-heading_medium guidance-title">
                                <lightning-icon icon-name="utility:help" size="small" class="title-icon"></lightning-icon>
                                Step {currentStep} of {totalSteps}: {currentStepData.title}
                            </h2>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <div class="header-controls">
                                <!-- Voice Commands Button -->
                                <template if:true={voiceCommandsAvailable}>
                                    <lightning-button-icon
                                        icon-name="utility:volume_high"
                                        alternative-text="Start voice commands"
                                        title="Activate voice commands (say 'help', 'next step', 'emergency help')"
                                        onclick={startListening}
                                        class="voice-control-btn">
                                    </lightning-button-icon>
                                </template>

                                <!-- Minimize Button -->
                                <lightning-button-icon
                                    if:false={isMinimized}
                                    icon-name="utility:minimize_window"
                                    alternative-text="Minimize guidance"
                                    title="Minimize guidance (Esc to close)"
                                    onclick={minimizeGuidance}
                                    class="minimize-btn">
                                </lightning-button-icon>

                                <!-- Maximize Button -->
                                <lightning-button-icon
                                    if:true={isMinimized}
                                    icon-name="utility:maximize_window"
                                    alternative-text="Maximize guidance"
                                    title="Maximize guidance"
                                    onclick={maximizeGuidance}
                                    class="maximize-btn">
                                </lightning-button-icon>

                                <!-- Close Button -->
                                <lightning-button-icon
                                    icon-name="utility:close"
                                    alternative-text="Close guidance"
                                    title="Close guidance (Esc)"
                                    onclick={closeGuidance}
                                    class="close-btn">
                                </lightning-button-icon>
                            </div>
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="progress-container slds-m-top_small">
                        <div class="slds-progress-bar slds-progress-bar_circular"
                             role="progressbar"
                             aria-valuemin="0"
                             aria-valuemax="100"
                             aria-valuenow={progressPercent}
                             aria-label="Guidance progress">
                            <span class="slds-progress-bar__value" style={progressStyle}>
                                <span class="slds-assistive-text">Progress: {progressPercent}%</span>
                            </span>
                        </div>
                        <span class="progress-text slds-text-body_small slds-m-left_small">
                            {progressPercent}% Complete
                        </span>
                    </div>
                </header>

                <!-- Content -->
                <div class="slds-modal__content slds-var-p-around_medium guidance-content" if:false={isMinimized}>
                    <!-- Emergency Alert -->
                    <template if:true={currentStepData.emergency}>
                        <div class="slds-scoped-notification slds-media slds-theme_error emergency-alert" role="alert">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="utility:warning" variant="inverse" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <p class="slds-text-heading_small">Emergency Resources Available 24/7</p>
                            </div>
                        </div>
                    </template>

                    <!-- Step Content -->
                    <div class="step-content">
                        <div id="guidance-content" class="slds-text-body_regular step-description">
                            {currentStepData.content}
                        </div>

                        <!-- Emergency Contact Quick Access -->
                        <template if:true={currentStepData.emergency}>
                            <div class="emergency-contacts slds-m-top_medium">
                                <div class="slds-grid slds-gutters_small slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <div class="emergency-contact-card">
                                            <lightning-button
                                                variant="destructive"
                                                label="988 Crisis Lifeline"
                                                onclick={callCrisisLine}
                                                class="emergency-btn full-width">
                                            </lightning-button>
                                            <p class="slds-text-body_small slds-text-align_center slds-m-top_x-small">
                                                24/7 Crisis Support
                                            </p>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <div class="emergency-contact-card">
                                            <lightning-button
                                                variant="destructive"
                                                label="Veterans Crisis Line"
                                                onclick={callVeteransCrisis}
                                                class="emergency-btn full-width">
                                            </lightning-button>
                                            <p class="slds-text-body_small slds-text-align_center slds-m-top_x-small">
                                                1-800-273-8255
                                            </p>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                        <div class="emergency-contact-card">
                                            <lightning-button
                                                variant="destructive"
                                                label="Text 838255"
                                                onclick={textCrisisSupport}
                                                class="emergency-btn full-width">
                                            </lightning-button>
                                            <p class="slds-text-body_small slds-text-align_center slds-m-top_x-small">
                                                Crisis Text Support
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Accessibility Preferences -->
                        <div class="accessibility-prefs slds-m-top_medium">
                            <details class="slds-details">
                                <summary class="slds-button slds-button_neutral">
                                    <lightning-icon icon-name="utility:settings" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    Accessibility Preferences
                                </summary>
                                <div class="slds-box slds-box_small slds-m-top_small">
                                    <div class="slds-grid slds-gutters_small slds-wrap">
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                            <lightning-input
                                                type="checkbox"
                                                label="Audio descriptions"
                                                checked={userPreferences.prefersAudio}
                                                data-preference="audio"
                                                onchange={toggleAccessibilityPreferences}
                                                class="accessibility-toggle">
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                            <lightning-input
                                                type="checkbox"
                                                label="High contrast"
                                                checked={userPreferences.prefersHighContrast}
                                                data-preference="contrast"
                                                onchange={toggleAccessibilityPreferences}
                                                class="accessibility-toggle">
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                            <lightning-input
                                                type="checkbox"
                                                label="Reduced motion"
                                                checked={userPreferences.prefersReducedMotion}
                                                data-preference="motion"
                                                onchange={toggleAccessibilityPreferences}
                                                class="accessibility-toggle">
                                            </lightning-input>
                                        </div>
                                    </div>
                                </div>
                            </details>
                        </div>

                        <!-- Voice Commands Help -->
                        <template if:true={voiceCommandsAvailable}>
                            <div class="voice-commands-help slds-m-top_medium">
                                <details class="slds-details">
                                    <summary class="slds-button slds-button_neutral">
                                        <lightning-icon icon-name="utility:volume_high" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        Voice Commands Available
                                    </summary>
                                    <div class="slds-box slds-box_small slds-m-top_small">
                                        <ul class="slds-list_dotted">
                                            <li>"Next step" - Move to next step</li>
                                            <li>"Previous step" - Go back one step</li>
                                            <li>"Emergency help" - Show crisis resources</li>
                                            <li>"Read this" - Repeat current step</li>
                                            <li>"Close help" - End guidance</li>
                                        </ul>
                                    </div>
                                </details>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Footer Navigation -->
                <footer class="slds-modal__footer guidance-footer" if:false={isMinimized}>
                    <div class="slds-grid slds-gutters_small slds-grid_align-spread">
                        <div class="slds-col">
                            <!-- Audio Controls -->
                            <template if:true={userPreferences.prefersAudio}>
                                <lightning-button
                                    variant="neutral"
                                    label="Read Step"
                                    icon-name="utility:volume_high"
                                    onclick={readCurrentStep}
                                    class="audio-control-btn">
                                </lightning-button>
                            </template>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <div class="navigation-controls">
                                <!-- Previous Button -->
                                <lightning-button
                                    variant="neutral"
                                    label="Previous"
                                    icon-name="utility:chevronleft"
                                    icon-position="left"
                                    disabled={isFirstStep}
                                    onclick={previousStep}
                                    class="nav-btn">
                                </lightning-button>

                                <!-- Next/Complete Button -->
                                <lightning-button
                                    variant="brand"
                                    label={nextButtonLabel}
                                    icon-name={nextButtonIcon}
                                    icon-position="right"
                                    onclick={nextStep}
                                    class="nav-btn nav-primary">
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Keyboard Shortcuts Help -->
                    <div class="keyboard-shortcuts slds-m-top_small">
                        <p class="slds-text-body_small slds-text-color_weak">
                            Keyboard shortcuts: Arrow keys to navigate • Esc to close • Home/End for first/last step
                        </p>
                    </div>
                </footer>
            </div>
        </section>

        <!-- Modal Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Floating Help Button (when guidance is not visible) -->
    <template if:false={isVisible}>
        <div class="floating-help-container">
            <lightning-button-icon
                icon-name="utility:help"
                alternative-text="Start guidance tour"
                title="Start guidance tour (say 'help' for voice control)"
                onclick={startGuidance}
                size="large"
                class="floating-help-btn">
            </lightning-button-icon>

            <!-- Emergency Quick Access -->
            <div class="emergency-quick-access">
                <lightning-button
                    variant="destructive"
                    label="Crisis Support"
                    icon-name="utility:warning"
                    onclick={showEmergencyHelp}
                    size="small"
                    class="emergency-quick-btn">
                </lightning-button>
            </div>
        </div>
    </template>
</template>
