<template>
    <!-- CVMA Role-Based Navigation - Single-Site Architecture -->
    <nav class="slds-card cvma-military-themed cvma-navigation-container">

        <!-- Navigation Header with User Role -->
        <div class="slds-card__header">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:groups" alternative-text="CVMA Chapter 20-7"
                                    size="medium" class="slds-icon-standard-groups"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h1 class="slds-card__header-title">
                        <span class="slds-card__header-link slds-truncate">
                            {welcomeMessage}
                        </span>
                    </h1>
                    <h2 class="slds-card__header-subtitle slds-truncate">
                        Chapter 20-7 | Jacksonville, FL | Vets Serving Vets
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <!-- User Role Badge -->
                    <lightning-badge if:true={showOfficerItems} label={userRoleLabel}
                                     class="cvma-btn-commander"></lightning-badge>
                    <lightning-badge if:true={showMemberItems} label={userRoleLabel}
                                     class="cvma-btn-veteran-support"></lightning-badge>
                    <lightning-badge if:true={isGuest} label="Visitor"
                                     class="cvma-btn-guest"></lightning-badge>
                </div>
            </header>
        </div>

        <!-- Main Navigation Menu -->
        <div class="slds-card__body slds-card__body_inner">

            <!-- Primary Navigation -->
            <div class="cvma-military-grid cvma-nav-primary">
                <template for:each={navigationItems} for:item="navItem" for:index="index">
                    <div key={navItem.id} class="cvma-military-button-container"
                         if:true={navItem.visible}>
                        <lightning-button
                            variant="base"
                            label={navItem.label}
                            title={navItem.description}
                            class={navItem.buttonClass}
                            data-id={navItem.id}
                            onclick={handleNavigation}>
                            <lightning-icon icon-name={navItem.icon} size="x-small"
                                            slot="iconLeft"></lightning-icon>
                        </lightning-button>
                    </div>
                </template>
            </div>

            <!-- Quick Actions - Members Only -->
            <template if:true={showQuickActions}>
                <div class="slds-section slds-is-open slds-m-top_medium">
                    <h2 class="slds-section__title">
                        <span class="slds-text-heading_small">Quick Actions</span>
                    </h2>
                    <div class="slds-section__content">
                        <div class="cvma-military-grid cvma-quick-actions">

                            <!-- Event Creation - Officers -->
                            <template if:true={showOfficerItems}>
                                <div class="cvma-military-button-container">
                                    <lightning-button
                                        variant="brand"
                                        label="Create Event"
                                        class="cvma-btn-bronze-star"
                                        data-action="create-event"
                                        onclick={handleQuickAction}>
                                        <lightning-icon icon-name="utility:event" size="x-small"
                                                        slot="iconLeft"></lightning-icon>
                                    </lightning-button>
                                </div>
                            </template>

                            <!-- Profile Management - All Members -->
                            <div class="cvma-military-button-container">
                                <lightning-button
                                    variant="neutral"
                                    label="My Profile"
                                    class="cvma-btn-national-defense"
                                    data-action="view-profile"
                                    onclick={handleQuickAction}>
                                    <lightning-icon icon-name="utility:user" size="x-small"
                                                    slot="iconLeft"></lightning-icon>
                                </lightning-button>
                            </div>

                            <!-- Crisis Support - Always Visible -->
                            <div class="cvma-military-button-container">
                                <lightning-button
                                    variant="destructive"
                                    label="Crisis Support"
                                    class="cvma-btn-purple-heart"
                                    data-action="crisis-support"
                                    onclick={handleQuickAction}>
                                    <lightning-icon icon-name="utility:warning" size="x-small"
                                                    slot="iconLeft"></lightning-icon>
                                </lightning-button>
                            </div>

                            <!-- Chapter Contact -->
                            <div class="cvma-military-button-container">
                                <lightning-button
                                    variant="neutral"
                                    label="Contact Chapter"
                                    class="cvma-btn-gwot"
                                    data-action="contact-chapter"
                                    onclick={handleQuickAction}>
                                    <lightning-icon icon-name="utility:phone" size="x-small"
                                                    slot="iconLeft"></lightning-icon>
                                </lightning-button>
                            </div>

                        </div>
                    </div>
                </div>
            </template>

            <!-- Guest Call-to-Action -->
            <template if:true={isGuest}>
                <div class="slds-section slds-is-open slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                        <h2 class="slds-text-heading_small">
                            <lightning-icon icon-name="utility:info" size="small"
                                            alternative-text="Member Information"
                                            class="slds-m-right_x-small"></lightning-icon>
                            Become a CVMA Member
                        </h2>
                        <div class="slds-m-top_x-small">
                            <p class="slds-text-body_regular">
                                Join the Combat Veterans Motorcycle Association and connect with fellow veterans
                                who understand your service and sacrifice.
                            </p>
                            <div class="cvma-military-grid slds-m-top_small">
                                <div class="cvma-military-button-container">
                                    <lightning-button
                                        variant="brand"
                                        label="Learn About Membership"
                                        class="cvma-btn-bronze-star"
                                        onclick={navigateToMembershipInfo}>
                                        <lightning-icon icon-name="utility:groups" size="x-small"
                                                        slot="iconLeft"></lightning-icon>
                                    </lightning-button>
                                </div>
                                <div class="cvma-military-button-container">
                                    <lightning-button
                                        variant="neutral"
                                        label="Contact Us"
                                        class="cvma-btn-national-defense"
                                        data-action="contact-chapter"
                                        onclick={handleQuickAction}>
                                        <lightning-icon icon-name="utility:email" size="x-small"
                                                        slot="iconLeft"></lightning-icon>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Navigation Footer -->
        <div class="slds-card__footer">
            <div class="slds-text-align_center">
                <p class="slds-text-body_small slds-text-color_weak">
                    🏍️ CVMA Chapter 20-7 | Single-Site Architecture | Role-Based Experience
                </p>
            </div>
        </div>

    </nav>
</template>
