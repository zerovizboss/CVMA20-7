<template>
    <lightning-card title="CVMA Event Management" icon-name="standard:event">
        <div class="slds-card__body slds-card__body_inner">

            <!-- Action Buttons with Military Awards Styling -->
            <div class="cvma-military-grid slds-m-bottom_medium">
                <div class="cvma-military-button-container">
                    <lightning-button
                        label="Create New Event"
                        class="cvma-btn-combat-action"
                        variant="brand"
                        onclick={openCreateModal}>
                    </lightning-button>
                </div>
                <div class="cvma-military-button-container">
                    <lightning-button
                        label="Refresh Events"
                        class="cvma-btn-bronze-star"
                        variant="neutral"
                        onclick={refreshEvents}>
                    </lightning-button>
                </div>
            </div>

            <!-- Events Data Table -->
            <template if:true={events.length}>
                <lightning-datatable
                    key-field="id"
                    data={events}
                    columns={columns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column="true"
                    show-row-number-column="true">
                </lightning-datatable>
            </template>

            <!-- No Events Message -->
            <template if:false={events.length}>
                <div class="slds-text-align_center slds-p-around_large">
                    <lightning-icon icon-name="utility:event" size="large" class="slds-m-bottom_small"></lightning-icon>
                    <p class="slds-text-heading_small">No events found</p>
                    <p class="slds-text-color_weak">Create your first CVMA event to get started</p>
                </div>
            </template>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading events..." size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>

    <!-- Create/Edit Event Modal -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        onclick={closeModal}
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close">
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium slds-hyphenate">
                        {modalTitle}
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-edit-form
                        object-api-name="Campaign"
                        onsubmit={handleSubmit}
                        onsuccess={handleSuccess}
                        onerror={handleError}>

                        <!-- Basic Event Information -->
                        <div class="slds-grid slds-gutters slds-wrap">
                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input-field
                                    field-name="Name"
                                    required="true"
                                    value={formData.name}>
                                </lightning-input-field>
                            </div>

                            <div class="slds-col slds-size_1-of-1">
                                <lightning-input-field
                                    field-name="Description"
                                    value={formData.description}>
                                </lightning-input-field>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="date"
                                    label="Start Date"
                                    value={formData.startDate}
                                    onchange={handleFieldChange}
                                    data-field="startDate"
                                    required="true">
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="date"
                                    label="End Date"
                                    value={formData.endDate}
                                    onchange={handleFieldChange}
                                    data-field="endDate">
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox
                                    label="Event Type"
                                    value={formData.eventType}
                                    options={eventTypeOptions}
                                    onchange={handleFieldChange}
                                    data-field="eventType">
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox
                                    label="Status"
                                    value={formData.status}
                                    options={statusOptions}
                                    onchange={handleFieldChange}
                                    data-field="status">
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="text"
                                    label="Location"
                                    value={formData.location}
                                    onchange={handleFieldChange}
                                    data-field="location">
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="number"
                                    label="Capacity (Optional)"
                                    value={formData.capacity}
                                    onchange={handleFieldChange}
                                    data-field="capacity"
                                    min="1">
                                </lightning-input>
                            </div>
                        </div>

                        <!-- Recurring Event Options -->
                        <div class="slds-m-top_medium">
                            <lightning-input
                                type="checkbox"
                                label="Create Recurring Event Series"
                                checked={formData.isRecurring}
                                onchange={handleFieldChange}
                                data-field="isRecurring">
                            </lightning-input>
                        </div>

                        <template if:true={formData.isRecurring}>
                            <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-combobox
                                        label="Recurrence Pattern"
                                        value={formData.recurrenceType}
                                        options={recurrenceOptions}
                                        onchange={handleFieldChange}
                                        data-field="recurrenceType"
                                        required="true">
                                    </lightning-combobox>
                                </div>

                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input
                                        type="number"
                                        label="Number of Occurrences"
                                        value={formData.recurrenceCount}
                                        onchange={handleFieldChange}
                                        data-field="recurrenceCount"
                                        min="2"
                                        max="52"
                                        required="true">
                                    </lightning-input>
                                </div>

                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input
                                        type="date"
                                        label="End Recurrence Date (Optional)"
                                        value={formData.endRecurrenceDate}
                                        onchange={handleFieldChange}
                                        data-field="endRecurrenceDate">
                                    </lightning-input>
                                </div>
                            </div>
                        </template>
                    </lightning-record-edit-form>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>
                    <lightning-button
                        label={submitButtonLabel}
                        variant="brand"
                        onclick={submitForm}
                        disabled={isSubmitting}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Event Details Modal -->
    <template if:true={showDetailsModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        onclick={closeDetailsModal}
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close">
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">
                        Event Details: {selectedEvent.event.Name}
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={selectedEvent}>
                        <div class="slds-grid slds-gutters slds-wrap">
                            <!-- Event Info -->
                            <div class="slds-col slds-size_1-of-2">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Event Information</h3>
                                <p><strong>Name:</strong> {selectedEvent.event.Name}</p>
                                <p><strong>Description:</strong> {selectedEvent.event.Description}</p>
                                <p><strong>Start Date:</strong> {selectedEvent.event.StartDate}</p>
                                <p><strong>End Date:</strong> {selectedEvent.event.EndDate}</p>
                                <p><strong>Status:</strong> {selectedEvent.event.Status}</p>
                            </div>

                            <!-- RSVP Summary -->
                            <div class="slds-col slds-size_1-of-2">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">RSVP Summary</h3>
                                <p><strong>Yes Responses:</strong> {selectedEvent.yesCount}</p>
                                <p><strong>No Responses:</strong> {selectedEvent.noCount}</p>
                                <p><strong>Maybe Responses:</strong> {selectedEvent.maybeCount}</p>
                                <p><strong>Total RSVPs:</strong> {selectedEvent.totalRSVPs}</p>
                                <p><strong>Available Spots:</strong> {availableSpotsDisplay}</p>
                            </div>
                        </div>

                        <!-- RSVP List -->
                        <template if:true={selectedEvent.rsvpList.length}>
                            <div class="slds-m-top_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">RSVP Details</h3>
                                <lightning-datatable
                                    key-field="Id"
                                    data={selectedEvent.rsvpList}
                                    columns={rsvpColumns}
                                    hide-checkbox-column="true">
                                </lightning-datatable>
                            </div>
                        </template>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        onclick={closeDetailsModal}>
                    </lightning-button>
                    <lightning-button
                        label="Edit Event"
                        variant="brand"
                        onclick={editEventFromDetails}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Toast Messages -->
    <template if:true={toastMessage}>
        <div class={toastClass} role="alert">
            <span class="slds-assistive-text">{toastVariant}</span>
            <span class="slds-icon_container slds-icon-utility-success slds-m-right_small">
                <lightning-icon icon-name={toastIcon} size="small"></lightning-icon>
            </span>
            <div class="slds-notify__content">
                <h2 class="slds-text-heading_small">{toastMessage}</h2>
            </div>
        </div>
    </template>
</template>
