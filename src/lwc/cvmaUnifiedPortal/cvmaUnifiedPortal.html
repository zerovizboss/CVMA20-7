<template>
    <!-- CVMA Unified Portal - Single-Site Architecture -->
    <div class="slds-card cvma-military-themed">
        <!-- Portal Header with Military Branding -->
        <div class="slds-card__header">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:groups" alternative-text="CVMA Chapter 20-7"
                                    size="medium" class="slds-icon-standard-groups"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h1 class="slds-card__header-title">
                        <span class="slds-card__header-link slds-truncate" title="Combat Veterans Motorcycle Association">
                            Combat Veterans Motorcycle Association
                        </span>
                    </h1>
                    <h2 class="slds-card__header-subtitle slds-truncate">
                        Chapter 20-7 - Jacksonville, FL | Vets Serving Vets
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <!-- User Role Badge -->
                    <lightning-badge if:true={isOfficer} label={userRole} class="cvma-btn-commander"></lightning-badge>
                    <lightning-badge if:false={isOfficer} label={userRole} class="cvma-btn-veteran-support"></lightning-badge>
                </div>
            </header>
        </div>

        <!-- Audience-Based Navigation -->
        <div class="slds-card__body slds-card__body_inner">

            <!-- Officer Dashboard Section -->
            <template if:true={showOfficerSection}>
                <div class="slds-section slds-is-open">
                    <h2 class="slds-section__title">
                        <button class="slds-button slds-section__title-action cvma-btn-officer-commendation"
                                onclick={toggleOfficerSection} aria-expanded="true">
                            <lightning-icon icon-name="utility:chevrondown" size="x-small"
                                            alternative-text="Toggle Officer Dashboard"></lightning-icon>
                            <span class="slds-truncate" title="Officer Dashboard">Officer Dashboard</span>
                        </button>
                    </h2>
                    <div class="slds-section__content">
                        <!-- CEB Training Hub Integration -->
                        <c-cvma-ceb-training-hub
                            display-mode="dashboard"
                            show-quick-actions={showQuickActions}
                            default-category="all">
                        </c-cvma-ceb-training-hub>
                    </div>
                </div>
            </template>

            <!-- Member Training Section -->
            <div class="slds-section slds-is-open">
                <h2 class="slds-section__title">
                    <button class="slds-button slds-section__title-action cvma-btn-bronze-star"
                            onclick={toggleTrainingSection} aria-expanded="true">
                        <lightning-icon icon-name="utility:chevrondown" size="x-small"
                                        alternative-text="Toggle Training Center"></lightning-icon>
                        <span class="slds-truncate" title="Training Center">Training Center</span>
                    </button>
                </h2>
                <div class="slds-section__content" if:true={showTrainingSection}>
                    <!-- Role-based Training Content -->
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                            <lightning-button variant="base" label="Member Orientation"
                                              class="slds-button cvma-military-award cvma-btn-national-defense"
                                              onclick={openMemberOrientation}>
                            </lightning-button>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                            <lightning-button variant="base" label="Chapter Protocols"
                                              class="slds-button cvma-military-award cvma-btn-gwot"
                                              onclick={openChapterProtocols}>
                            </lightning-button>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                            <lightning-button variant="base" label="Safety Training"
                                              class="slds-button cvma-military-award cvma-btn-combat-action"
                                              onclick={openSafetyTraining}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Knowledge Base & Support -->
            <div class="slds-section slds-is-open">
                <h2 class="slds-section__title">
                    <button class="slds-button slds-section__title-action cvma-btn-purple-heart"
                            onclick={toggleKnowledgeSection} aria-expanded="true">
                        <lightning-icon icon-name="utility:chevrondown" size="x-small"
                                        alternative-text="Toggle Knowledge Base"></lightning-icon>
                        <span class="slds-truncate" title="Knowledge Base & Support">Knowledge Base & Support</span>
                    </button>
                </h2>
                <div class="slds-section__content" if:true={showKnowledgeSection}>
                    <!-- Veteran Knowledge Base Integration -->
                    <c-cvma-veteran-knowledge-base
                        enable-search={enableSearch}
                        crisis-support-enabled={crisisSupportEnabled}
                        audience-filter={audienceFilter}>
                    </c-cvma-veteran-knowledge-base>
                </div>
            </div>

            <!-- Document Management -->
            <div class="slds-section slds-is-open">
                <h2 class="slds-section__title">
                    <button class="slds-button slds-section__title-action cvma-nav-meritorious"
                            onclick={toggleDocumentSection} aria-expanded="true">
                        <lightning-icon icon-name="utility:chevrondown" size="x-small"
                                        alternative-text="Toggle Document Center"></lightning-icon>
                        <span class="slds-truncate" title="Document Center">Document Center</span>
                    </button>
                </h2>
                <div class="slds-section__content" if:true={showDocumentSection}>
                    <!-- Unified Document Management -->
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- CVMA Bylaws -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-button variant="base" label="CVMA Bylaws"
                                              class="slds-button cvma-military-award cvma-btn-bronze-star"
                                              onclick={openBylaws}>
                                <lightning-icon icon-name="utility:file" size="x-small" slot="iconLeft"></lightning-icon>
                            </lightning-button>
                        </div>
                        <!-- Standard Operating Procedures -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-button variant="base" label="SOPs & Protocols"
                                              class="slds-button cvma-military-award cvma-btn-gwot"
                                              onclick={openSOPs}>
                                <lightning-icon icon-name="utility:knowledge_base" size="x-small" slot="iconLeft"></lightning-icon>
                            </lightning-button>
                        </div>
                        <!-- Forms & Templates -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-button variant="base" label="Forms & Templates"
                                              class="slds-button cvma-military-award cvma-btn-national-defense"
                                              onclick={openForms}>
                                <lightning-icon icon-name="utility:form" size="x-small" slot="iconLeft"></lightning-icon>
                            </lightning-button>
                        </div>
                        <!-- Document Manager -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <c-cvma-document-manager
                                target-audience={userRole}
                                enable-pdf-generation="true">
                            </c-cvma-document-manager>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Crisis Support (Always Visible) -->
            <div class="slds-section slds-is-open slds-m-top_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture" role="alert">
                    <h2 class="slds-text-heading_small">
                        <lightning-icon icon-name="utility:warning" size="small"
                                        alternative-text="Crisis Support" class="slds-m-right_x-small"></lightning-icon>
                        24/7 Crisis Support Available
                    </h2>
                    <div class="slds-m-top_x-small">
                        <lightning-button variant="brand" label="Veterans Crisis Line"
                                          class="slds-button cvma-military-award cvma-btn-purple-heart"
                                          onclick={contactCrisisLine}>
                            📞 1-800-273-8255
                        </lightning-button>
                        <lightning-button variant="neutral" label="Chapter Emergency Contact"
                                          class="slds-button cvma-military-award cvma-btn-combat-action slds-m-left_x-small"
                                          onclick={contactChapterEmergency}>
                            🏍️ Chapter Support
                        </lightning-button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Portal Footer -->
        <div class="slds-card__footer">
            <div class="slds-text-align_center">
                <p class="slds-text-body_small slds-text-color_weak">
                    🏍️ Combat Veterans Motorcycle Association Chapter 20-7 | Jacksonville, FL
                    <br>
                    Vets Serving Vets | Honoring Those Who Served
                </p>
            </div>
        </div>
    </div>
</template>
