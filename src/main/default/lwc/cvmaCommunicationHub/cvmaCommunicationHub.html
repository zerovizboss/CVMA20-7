<template>
    <div class={containerClass} style={componentHeight}>
        <!-- Header -->
        <div class="slds-card__header">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:chat" alternative-text="Communication Hub" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">{componentTitle}</span>
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <lightning-badge if:true={currentUser.isOfficer} label="Officer" variant="success"></lightning-badge>
                </div>
            </header>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-card__body slds-card__body_inner">
                <lightning-spinner alternative-text="Loading communications..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={error}>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-notify slds-notify_alert slds-alert_error">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" size="x-small"></lightning-icon>
                    <h2 class="slds-text-heading_small">{error}</h2>
                </div>
            </div>
        </template>

        <!-- Main Content -->
        <template if:false={isLoading}>
            <template if:false={error}>
                <!-- Tab Navigation -->
                <div class="slds-card__body">
                    <lightning-tabset active-tab-value={selectedTab} onactivechange={handleTabChange}>

                        <!-- Inbox Tab -->
                        <lightning-tab label="Inbox" value="inbox">
                            <div class="slds-scrollable_y communication-list">
                                <template if:true={hasRecentCommunications}>
                                    <template for:each={recentCommunications} for:item="communication">
                                        <div key={communication.id}
                                             class="slds-media slds-media_center communication-item slds-p-around_small slds-border_bottom"
                                             data-id={communication.id}
                                             onclick={handleCommunicationClick}>

                                            <div class="slds-media__figure">
                                                <lightning-icon
                                                    icon-name={communication.typeIcon}
                                                    size="small"
                                                    variant={communication.isHighPriority ? 'warning' : 'inverse'}>
                                                </lightning-icon>
                                            </div>

                                            <div class="slds-media__body">
                                                <div class="slds-grid slds-wrap">
                                                    <div class="slds-col slds-size_3-of-4">
                                                        <h3 class="slds-text-heading_small slds-truncate">
                                                            {communication.subject}
                                                        </h3>
                                                        <p class="slds-text-body_small slds-text-color_weak">
                                                            {communication.typeLabel}
                                                        </p>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                                        <p class="slds-text-body_small slds-text-color_weak">
                                                            {communication.formattedDate}
                                                        </p>
                                                        <template if:true={communication.isHighPriority}>
                                                            <lightning-badge label="High Priority" variant="warning"></lightning-badge>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </template>

                                <template if:false={hasRecentCommunications}>
                                    <div class="slds-text-align_center slds-p-around_large">
                                        <lightning-icon icon-name="utility:email" size="large" variant="inverse"></lightning-icon>
                                        <h3 class="slds-text-heading_small slds-m-top_medium">No Recent Communications</h3>
                                        <p class="slds-text-body_regular">You'll see your latest messages and notifications here.</p>
                                    </div>
                                </template>
                            </div>
                        </lightning-tab>

                        <!-- Chatter Groups Tab -->
                        <lightning-tab label="Groups" value="groups">
                            <div class="slds-scrollable_y communication-list">
                                <template if:true={hasChatterGroups}>
                                    <template for:each={chatterGroups} for:item="group">
                                        <div key={group.id}
                                             class="slds-media slds-media_center group-item slds-p-around_small slds-border_bottom"
                                             data-id={group.id}
                                             onclick={handleGroupClick}>

                                            <div class="slds-media__figure">
                                                <lightning-icon
                                                    icon-name="utility:groups"
                                                    size="small"
                                                    variant={group.hasNewPosts ? 'brand' : 'inverse'}>
                                                </lightning-icon>
                                            </div>

                                            <div class="slds-media__body">
                                                <div class="slds-grid slds-wrap">
                                                    <div class="slds-col slds-size_3-of-4">
                                                        <h3 class="slds-text-heading_small slds-truncate">
                                                            {group.name}
                                                        </h3>
                                                        <p class="slds-text-body_small slds-text-color_weak">
                                                            {group.memberCount} members • {group.formattedLastPost}
                                                        </p>
                                                    </div>
                                                    <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                                                        <template if:true={group.hasNewPosts}>
                                                            <lightning-badge label="New Posts" variant="brand"></lightning-badge>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </template>

                                <template if:false={hasChatterGroups}>
                                    <div class="slds-text-align_center slds-p-around_large">
                                        <lightning-icon icon-name="utility:groups" size="large" variant="inverse"></lightning-icon>
                                        <h3 class="slds-text-heading_small slds-m-top_medium">No Chatter Groups</h3>
                                        <p class="slds-text-body_regular">Join groups to connect with other chapter members.</p>
                                    </div>
                                </template>
                            </div>
                        </lightning-tab>

                        <!-- Compose Tab -->
                        <lightning-tab label="Compose" value="compose">
                            <div class="slds-p-around_medium">
                                <form class="slds-form slds-form_stacked">
                                    <!-- Communication Type -->
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label" for="composer-type">Communication Type</label>
                                        <div class="slds-form-element__control">
                                            <lightning-combobox
                                                name="composerType"
                                                value={composerType}
                                                options={composerTypeOptions}
                                                onchange={handleComposeTypeChange}>
                                            </lightning-combobox>
                                        </div>
                                    </div>

                                    <!-- Priority -->
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label" for="composer-priority">Priority</label>
                                        <div class="slds-form-element__control">
                                            <lightning-combobox
                                                name="composerPriority"
                                                value={composerPriority}
                                                options={priorityOptions}
                                                onchange={handlePriorityChange}>
                                            </lightning-combobox>
                                        </div>
                                    </div>

                                    <!-- Subject -->
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label" for="composer-subject">Subject</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input
                                                type="text"
                                                name="composerSubject"
                                                value={composerSubject}
                                                onchange={handleSubjectChange}
                                                placeholder="Enter communication subject">
                                            </lightning-input>
                                        </div>
                                    </div>

                                    <!-- Message Body -->
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label" for="composer-body">Message</label>
                                        <div class="slds-form-element__control">
                                            <lightning-textarea
                                                name="composerBody"
                                                value={composerBody}
                                                onchange={handleBodyChange}
                                                placeholder="Enter your message here..."
                                                rows="6">
                                            </lightning-textarea>
                                        </div>
                                    </div>

                                    <!-- Actions -->
                                    <div class="slds-form-element slds-m-top_medium">
                                        <div class="slds-form-element__control">
                                            <div class="slds-button-group" role="group">
                                                <lightning-button
                                                    variant="brand"
                                                    label="Send Communication"
                                                    onclick={handleSendCommunication}
                                                    disabled={isLoading}>
                                                </lightning-button>
                                                <lightning-button
                                                    variant="neutral"
                                                    label="Clear"
                                                    onclick={resetComposer}>
                                                </lightning-button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </lightning-tab>

                        <!-- Analytics Tab -->
                        <lightning-tab label="Analytics" value="analytics">
                            <div class="slds-p-around_medium">
                                <div class="slds-text-align_center">
                                    <lightning-icon icon-name="utility:chart" size="large" variant="inverse"></lightning-icon>
                                    <h3 class="slds-text-heading_small slds-m-top_medium">Communication Analytics</h3>
                                    <p class="slds-text-body_regular">View communication engagement metrics and trends.</p>
                                    <lightning-button
                                        variant="brand"
                                        label="View Full Analytics Dashboard"
                                        class="slds-m-top_medium">
                                    </lightning-button>
                                </div>
                            </div>
                        </lightning-tab>

                    </lightning-tabset>
                </div>
            </template>
        </template>
    </div>
</template>
