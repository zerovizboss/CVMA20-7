<!--
  @description LWC template for CVMA Legal Resources component
  User Story #75: Legal & Advocacy Services Resources
  @author CVMA Chapter 20-7
  @date 2025-10-20
-->
<template>
    <lightning-card title="Legal & Advocacy Services" icon-name="standard:service_resource">

        <template if:false={showResources}>
            <div class="slds-p-around_medium">
                <lightning-formatted-text value={guestMessage}></lightning-formatted-text>
            </div>
        </template>

        <template if:true={showResources}>
            <!-- Filter by Resource Type -->
            <div class="slds-p-horizontal_medium slds-p-top_medium">
                <lightning-combobox
                    name="resourceType"
                    label="Filter by Resource Type"
                    value={selectedType}
                    placeholder="Select Resource Type"
                    options={typeOptions}
                    onchange={handleTypeChange}
                ></lightning-combobox>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading legal resources..."></lightning-spinner>
                </div>
            </template>

            <!-- Resources Grid -->
            <template if:false={isLoading}>
                <template if:true={hasResources}>
                    <div class="cvma-resource-grid slds-p-around_medium">
                        <template for:each={resources} for:item="resource">
                            <article key={resource.resourceName} class="cvma-resource-card cvma-military-ribbon">
                                <div class="cvma-card-header">
                                    <h3 class="cvma-card-title">{resource.resourceName}</h3>
                                    <div class="cvma-badge-container">
                                        <lightning-badge label={resource.resourceType}></lightning-badge>
                                        <template if:true={resource.proBonoAvailable}>
                                            <lightning-badge label="Pro Bono" variant="success"></lightning-badge>
                                        </template>
                                    </div>
                                </div>

                                <div class="cvma-card-body">
                                    <p class="cvma-description">{resource.description}</p>

                                    <div class="cvma-contact-info">
                                        <template if:true={resource.serviceArea}>
                                            <div class="cvma-info-item">
                                                <lightning-icon icon-name="utility:location" size="x-small"></lightning-icon>
                                                <span>{resource.serviceArea}</span>
                                            </div>
                                        </template>

                                        <template if:true={resource.contactPhone}>
                                            <div class="cvma-info-item">
                                                <lightning-icon icon-name="utility:phone" size="x-small"></lightning-icon>
                                                <lightning-formatted-phone value={resource.contactPhone}></lightning-formatted-phone>
                                            </div>
                                        </template>

                                        <template if:true={resource.contactEmail}>
                                            <div class="cvma-info-item">
                                                <lightning-icon icon-name="utility:email" size="x-small"></lightning-icon>
                                                <lightning-formatted-email value={resource.contactEmail}></lightning-formatted-email>
                                            </div>
                                        </template>
                                    </div>

                                    <template if:true={resource.eligibilityRequirements}>
                                        <div class="cvma-eligibility">
                                            <strong>Eligibility:</strong> {resource.eligibilityRequirements}
                                        </div>
                                    </template>
                                </div>

                                <div class="cvma-card-footer">
                                    <template if:true={resource.websiteUrl}>
                                        <a href={resource.websiteUrl} target="_blank" class="cvma-button cvma-button-primary">
                                            Visit Website
                                        </a>
                                    </template>
                                    <template if:true={resource.appointmentRequired}>
                                        <lightning-badge label="Appointment Required" variant="warning"></lightning-badge>
                                    </template>
                                </div>
                            </article>
                        </template>
                    </div>
                </template>

                <template if:false={hasResources}>
                    <div class="slds-p-around_medium slds-text-align_center">
                        <p class="slds-text-color_weak">No legal resources found for the selected filter.</p>
                    </div>
                </template>
            </template>
        </template>

    </lightning-card>
</template>
