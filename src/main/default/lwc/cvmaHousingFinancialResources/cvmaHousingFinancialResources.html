<!--
  @description LWC template for CVMA Housing & Financial Resources component
  User Story #74: Housing & Financial Assistance Resources
  @author CVMA Chapter 20-7
  @date 2025-10-21
-->
<template>
    <lightning-card title="Housing & Financial Assistance" icon-name="standard:household">

        <template if:false={showResources}>
            <div class="slds-p-around_medium">
                <lightning-formatted-text value={guestMessage}></lightning-formatted-text>
            </div>
        </template>

        <template if:true={showResources}>
            <!-- Emergency Resources Button & Filter -->
            <div class="slds-p-horizontal_medium slds-p-top_medium">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                    <div class="slds-col">
                        <lightning-button
                            variant="destructive"
                            label="🚨 Emergency Resources (24/7)"
                            onclick={handleShowEmergency}
                            class="slds-m-right_small"
                        ></lightning-button>
                        <template if:true={showEmergencyOnly}>
                            <lightning-button
                                variant="neutral"
                                label="Show All Resources"
                                onclick={handleShowAll}
                            ></lightning-button>
                        </template>
                    </div>
                </div>

                <template if:false={showEmergencyOnly}>
                    <lightning-combobox
                        name="resourceType"
                        label="Filter by Resource Type"
                        value={selectedType}
                        placeholder="Select Resource Type"
                        options={typeOptions}
                        onchange={handleTypeChange}
                    ></lightning-combobox>
                </template>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading housing/financial resources..."></lightning-spinner>
                </div>
            </template>

            <!-- Resources List -->
            <template if:false={isLoading}>
                <template if:true={hasResources}>
                    <div class="slds-p-around_medium">
                        <template for:each={resources} for:item="resource">
                            <article key={resource.resourceName} class="slds-card slds-m-bottom_medium cvma-military-ribbon">
                                <div class="slds-card__header slds-grid">
                                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                        <div class="slds-media__body">
                                            <h2 class="slds-card__header-title">
                                                <span class="slds-text-heading_small">{resource.resourceName}</span>
                                            </h2>
                                            <lightning-badge label={resource.resourceType}></lightning-badge>
                                            <template if:true={resource.emergencyService}>
                                                <lightning-badge label="🚨 Emergency 24/7" variant="error" class="slds-m-left_x-small"></lightning-badge>
                                            </template>
                                            <template if:true={resource.cebApprovalRequired}>
                                                <lightning-badge label="CEB Approval Required" variant="warning" class="slds-m-left_x-small"></lightning-badge>
                                            </template>
                                        </div>
                                    </header>
                                </div>
                                <div class="slds-card__body slds-card__body_inner">
                                    <p class="slds-m-bottom_small">{resource.description}</p>

                                    <dl class="slds-list_horizontal slds-wrap">
                                        <template if:true={resource.serviceArea}>
                                            <dt class="slds-item_label slds-text-color_weak">Service Area:</dt>
                                            <dd class="slds-item_detail slds-m-right_large">{resource.serviceArea}</dd>
                                        </template>

                                        <template if:true={resource.contactPhone}>
                                            <dt class="slds-item_label slds-text-color_weak">Phone:</dt>
                                            <dd class="slds-item_detail slds-m-right_large">
                                                <lightning-formatted-phone value={resource.contactPhone}></lightning-formatted-phone>
                                            </dd>
                                        </template>

                                        <template if:true={resource.contactEmail}>
                                            <dt class="slds-item_label slds-text-color_weak">Email:</dt>
                                            <dd class="slds-item_detail slds-m-right_large">
                                                <lightning-formatted-email value={resource.contactEmail}></lightning-formatted-email>
                                            </dd>
                                        </template>

                                        <template if:true={resource.websiteUrl}>
                                            <dt class="slds-item_label slds-text-color_weak">Website:</dt>
                                            <dd class="slds-item_detail slds-m-right_large">
                                                <lightning-formatted-url value={resource.websiteUrl} target="_blank"></lightning-formatted-url>
                                            </dd>
                                        </template>

                                        <template if:true={resource.address}>
                                            <dt class="slds-item_label slds-text-color_weak">Address:</dt>
                                            <dd class="slds-item_detail slds-m-right_large">{resource.address}</dd>
                                        </template>
                                    </dl>

                                    <template if:true={resource.eligibilityRequirements}>
                                        <div class="slds-m-top_small">
                                            <p class="slds-text-color_weak slds-text-body_small">
                                                <strong>Eligibility:</strong> {resource.eligibilityRequirements}
                                            </p>
                                        </div>
                                    </template>
                                </div>
                            </article>
                        </template>
                    </div>
                </template>

                <template if:false={hasResources}>
                    <div class="slds-p-around_medium slds-text-align_center">
                        <p class="slds-text-color_weak">No housing/financial resources found for the selected filter.</p>
                    </div>
                </template>
            </template>
        </template>

    </lightning-card>
</template>
