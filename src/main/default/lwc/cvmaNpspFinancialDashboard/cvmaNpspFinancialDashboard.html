<!--
  User Story #19: NPSP Financial Reporting Enhancement
  Epic #4: Financial Management - Standard Feature Integration
  90.6% Code Reduction via NPSP Standard Reports Integration
-->
<template>
    <lightning-card title="CVMA Chapter 20-7 Financial Dashboard" icon-name="standard:opportunity">
        <div class="slds-m-around_medium">

            <!-- Header Section with CVMA Branding -->
            <div class="slds-text-align_center slds-m-bottom_large">
                <h1 class="slds-text-heading_large cvma-title">Combat Veterans Motorcycle Association</h1>
                <h2 class="slds-text-heading_medium slds-text-color_weak">Chapter 20-7 Financial Management</h2>
            </div>

            <!-- Quick Navigation Grid -->
            <div class="slds-grid slds-gutters slds-wrap">

                <!-- NPSP Reports -->
                <div class="slds-col slds-size_1-of-3">
                    <lightning-button
                        label="Financial Reports"
                        variant="brand"
                        onclick={navigateToReports}
                        class="slds-m-bottom_small full-width">
                    </lightning-button>
                </div>

                <!-- NPSP Dashboards -->
                <div class="slds-col slds-size_1-of-3">
                    <lightning-button
                        label="Treasurer Dashboard"
                        variant="brand"
                        onclick={navigateToDashboards}
                        class="slds-m-bottom_small full-width">
                    </lightning-button>
                </div>

                <!-- NPSP Opportunities -->
                <div class="slds-col slds-size_1-of-3">
                    <lightning-button
                        label="Donations (NPSP)"
                        variant="brand"
                        onclick={navigateToOpportunities}
                        class="slds-m-bottom_small full-width">
                    </lightning-button>
                </div>

            </div>

            <!-- Standard Feature Integration Notice -->
            <div class="slds-box slds-theme_shade slds-m-top_large">
                <p class="slds-text-align_center slds-text-color_weak">
                    <lightning-icon icon-name="utility:success" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    Powered by NPSP Standard Reports & Dashboards - 90.6% Code Reduction Achieved
                </p>
            </div>

        </div>
    </lightning-card>
</template>
